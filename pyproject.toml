[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atomlab"
version = "0.1.0"
description = "Linear-response analysis of machine-learned interatomic potential error propagation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.59",
    "torch>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ase>=3.22", "pandas>=2.0", "tqdm", "sympy"]

[tool.setuptools.packages.find]
include = ["atomlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests that take more than ~10 s",
    "physics: end-to-end physics validation tests",
]
